<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ustaad - Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // into just a query string, and then redirects the browser to the new url
      // with only a query string and hash fragment,
      // e.g. https://foo.tld/one/two?a=b&c=d#qwe, becomes
      // https://foo.tld/?/one/two&a=b~and~c=d#qwe
      // Note: pathSegmentsToKeep is set to 1 for project pages hosted at
      // https://<username>.github.io/<repo-name>/
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Ustaad...</p>
  </body>
</html>
