<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Base href for GitHub Pages routing.
    Replaced by flutter build --base-href argument.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  
  <!-- Primary Meta Tags -->
  <title>Ustaad | AI-Powered Home Services Booking in Pakistan</title>
  <meta name="title" content="Ustaad | AI-Powered Home Services Booking in Pakistan">
  <meta name="description" content="Book trusted, verified local technicians across Pakistan. Electricians, plumbers, AC repair, cleaning, tutors, and beauticians with InDrive-style transparent bidding and AI triage.">
  <meta name="keywords" content="Ustaad, home services Pakistan, electrician Islamabad, plumber Rawalpindi, AC repair, InDrive bidding, AI agent booking">
  <meta name="author" content="Ustaad Team">
  <meta name="theme-color" content="#101010">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://zaintahir2025.github.io/ustaad-agentic-service-app/">
  <meta property="og:title" content="Ustaad | AI-Powered Home Services Booking in Pakistan">
  <meta property="og:description" content="Book trusted, verified technicians with transparent bidding and AI triage in Pakistan.">
  <meta property="og:image" content="assets/branding/ustaad_logo.png">
  <meta property="og:site_name" content="Ustaad">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://zaintahir2025.github.io/ustaad-agentic-service-app/">
  <meta property="twitter:title" content="Ustaad | AI-Powered Home Services in Pakistan">
  <meta property="twitter:description" content="Book verified electricians, plumbers, AC technicians, cleaners, tutors and beauticians.">
  <meta property="twitter:image" content="assets/branding/ustaad_logo.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ustaad">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Single Page Apps for GitHub Pages SPA deep link restoration -->
  <script type="text/javascript">
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #101010;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #101010;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    .splash-logo {
      width: 160px;
      max-width: 60vw;
      height: auto;
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    .splash-title {
      color: #F7F7F7;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin: 0 0 8px 0;
      text-transform: uppercase;
    }
    .splash-tagline {
      color: #8D8F94;
      font-size: 13px;
      margin: 0 0 28px 0;
      text-align: center;
      padding: 0 16px;
    }
    .splash-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(190, 255, 61, 0.18);
      border-top-color: #BEFF3D;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.92; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
  </style>
</head>
<body>
  <!-- Pre-Flutter Loading Splash Screen -->
  <div id="splash">
    <img class="splash-logo" src="assets/branding/ustaad_logo.png" alt="Ustaad Logo" onerror="this.style.display='none'">
    <h1 class="splash-title">USTAAD</h1>
    <p class="splash-tagline">AI-Powered Home Services in Pakistan</p>
    <div class="splash-spinner" aria-label="Loading Ustaad..."></div>
  </div>

  <script>
    window.addEventListener('load', function() {
      // Once Flutter is loaded and renders first frame, fade out the splash screen
      var splash = document.getElementById('splash');
      if (splash) {
        window.setTimeout(function() {
          splash.style.opacity = '0';
          window.setTimeout(function() {
            splash.remove();
          }, 450);
        }, 1200);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
